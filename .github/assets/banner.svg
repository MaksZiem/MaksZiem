<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Maksymilian Ziembicki – Full-Stack Developer">
  <defs>
    <radialGradient id="glow" cx="84%" cy="10%" r="60%">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="64%" cy="42%" r="45%">
      <stop offset="0" stop-color="#4c9fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4c9fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0%" cy="100%" r="55%">
      <stop offset="0" stop-color="#3ccf91" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3ccf91" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotmask" cx="82%" cy="12%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededef"/>
      <stop offset="0.7" stop-color="#ededef"/>
      <stop offset="1" stop-color="#c4b5ff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#ededef" fill-opacity="0.14"/>
    </pattern>
    <pattern id="dotsLit" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#b9a6ff" fill-opacity="0.6"/>
    </pattern>
    <mask id="fadeMask"><rect width="1280" height="420" fill="url(#fade)"/></mask>
    <mask id="litMask"><rect width="1280" height="420" fill="url(#dotmask)"/></mask>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#0a0a0b"/>
    <rect width="1280" height="420" fill="url(#dots)" mask="url(#fadeMask)"/>
    <rect width="1280" height="420" fill="url(#dotsLit)" mask="url(#litMask)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect width="1280" height="420" fill="url(#glow2)"/>
    <rect width="1280" height="420" fill="url(#glow3)"/>
    <g>
      <circle cx="80" cy="96" r="5" fill="#3ccf91"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="96" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5" fill="#3ccf91">FULL-STACK DEVELOPER · WARSAW, POLAND</text>
    </g>
    <text x="68" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3" fill="url(#title)">Maksymilian Ziembicki</text>
    <text x="72" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9a9aa3"><tspan x="72" dy="0">I design and build complete web applications – from backend</tspan><tspan x="72" dy="30">architecture and the database to a polished interface, with AI built in safely.</tspan></text>
    <text x="72" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#71717a">$ TypeScript · NestJS · Next.js · PostgreSQL · Redis · BullMQ · Gemini <tspan fill="#3ccf91">█<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
